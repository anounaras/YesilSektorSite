<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakırköy — Hava Durumu</title>
<style>
  :root{
    --sea: #1B4A5A;
    --sea-deep: #0F2E3A;
    --foam: #EAF3F1;
    --sand: #D8C9A8;
    --sun: #E8A33D;
    --text: #12262C;
    --muted: #5B7378;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: linear-gradient(180deg, var(--sea-deep) 0%, var(--sea) 55%, #2A6070 100%);
    color: var(--foam);
    min-height: 100vh;
    padding: 40px 20px 60px;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
  }
  .masthead{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(234,243,241,0.25);
    padding-bottom: 18px;
    margin-bottom: 36px;
  }
  .masthead h1{
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--sand);
  }
  .masthead .place{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.75rem;
    color: rgba(234,243,241,0.6);
  }
  .now{
    text-align: left;
    margin-bottom: 44px;
  }
  .now .temp{
    font-size: 6rem;
    line-height: 1;
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  .now .cond{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.05rem;
    color: var(--sand);
    margin-top: 10px;
  }
  .now .meta{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    color: rgba(234,243,241,0.55);
    margin-top: 6px;
  }
  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: rgba(234,243,241,0.15);
    margin-bottom: 48px;
    border-top: 1px solid rgba(234,243,241,0.25);
    border-bottom: 1px solid rgba(234,243,241,0.25);
  }
  .stat{
    background: rgba(15,46,58,0.4);
    padding: 18px 16px;
  }
  .stat .label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    color: rgba(234,243,241,0.5);
    margin-bottom: 6px;
  }
  .stat .value{
    font-size: 1.4rem;
  }
  .forecast h2{
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--sand);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(234,243,241,0.25);
  }
  .day-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(234,243,241,0.1);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .day-row:last-child{border-bottom: none;}
  .day-name{
    width: 90px;
    font-size: 0.9rem;
  }
  .day-cond{
    flex: 1;
    text-align: center;
    font-size: 0.82rem;
    color: rgba(234,243,241,0.6);
  }
  .day-range{
    width: 110px;
    text-align: right;
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .day-range .low{
    color: rgba(234,243,241,0.5);
  }
  .footer-note{
    margin-top: 40px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    color: rgba(234,243,241,0.35);
    text-align: left;
  }
  .loading, .error{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: rgba(234,243,241,0.6);
    font-size: 0.9rem;
  }
  .error{ color: #E8A33D; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <h1>Deniz Kıyısından</h1>
      <div class="place">Bakırköy, İstanbul</div>
    </div>

    <div id="content">
      <p class="loading">Hava durumu yükleniyor…</p>
    </div>

    <div class="footer-note">Veri kaynağı: Open-Meteo</div>
  </div>

<script>
const LAT = 40.9819;
const LON = 28.8772;

const weatherText = {
  0: "Açık", 1: "Çoğunlukla açık", 2: "Parçalı bulutlu", 3: "Kapalı",
  45: "Sisli", 48: "Kırağı sisi",
  51: "Hafif çisenti", 53: "Çisenti", 55: "Yoğun çisenti",
  61: "Hafif yağmurlu", 63: "Yağmurlu", 65: "Kuvvetli yağmur",
  71: "Hafif kar", 73: "Kar yağışlı", 75: "Kuvvetli kar",
  80: "Sağanak", 81: "Kuvvetli sağanak", 82: "Şiddetli sağanak",
  95: "Gök gürültülü fırtına", 96: "Dolulu fırtına", 99: "Şiddetli dolulu fırtına"
};

const dayNames = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FIstanbul&forecast_days=7`;

  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("İstek başarısız");
    const data = await res.json();
    render(data);
  }catch(err){
    document.getElementById('content').innerHTML =
      `<p class="error">Hava durumu alınamadı. Lütfen sayfayı yenileyin.</p>`;
    console.error(err);
  }
}

function render(data){
  const c = data.current;
  const d = data.daily;

  const nowCond = weatherText[c.weather_code] || "Bilinmiyor";
  const today = new Date();
  const todayIdx = 0;

  let html = `
    <div class="now">
      <div class="temp">${Math.round(c.temperature_2m)}°</div>
      <div class="cond">${nowCond} · Hissedilen ${Math.round(c.apparent_temperature)}°</div>
      <div class="meta">${today.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">NEM</div>
        <div class="value">%${c.relative_humidity_2m}</div>
      </div>
      <div class="stat">
        <div class="label">RÜZGÂR</div>
        <div class="value">${Math.round(c.wind_speed_10m)} km/s</div>
      </div>
      <div class="stat">
        <div class="label">BUGÜN</div>
        <div class="value">${Math.round(d.temperature_2m_max[todayIdx])}° / ${Math.round(d.temperature_2m_min[todayIdx])}°</div>
      </div>
    </div>

    <div class="forecast">
      <h2>7 Günlük Görünüm</h2>
  `;

  for(let i=0; i<d.time.length; i++){
    const date = new Date(d.time[i]);
    const label = i === 0 ? "Bugün" : dayNames[date.getDay()];
    const cond = weatherText[d.weather_code[i]] || "—";
    html += `
      <div class="day-row">
        <div class="day-name">${label}</div>
        <div class="day-cond">${cond}</div>
        <div class="day-range"><span class="high">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="low">${Math.round(d.temperature_2m_min[i])}°</span></div>
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

loadWeather();
</script>
</body>
</html>
